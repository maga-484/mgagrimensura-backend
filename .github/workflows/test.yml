name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mgagrimensura_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mgagrimensura_test
          JWT_SECRET: test_jwt_secret_key
          ADMIN_USER: admin
          ADMIN_PASSWORD: testpass123
          ADMIN_EMAIL: ''
          RESEND_API_KEY: ''
          EMAIL_USER: ''
          EMAIL_PASS: ''
          ADMIN_LOGS_VIEW: 'true'
          NODE_ENV: test